<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Ready Bundle</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #202b3c; font-family: Arial, sans-serif; }
        main { max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px; }
        .product { display: grid; grid-template-columns: 1.1fr 1fr; gap: 58px; align-items: center; }
        .product-image { width: 100%; height: 470px; object-fit: cover; border-radius: 14px; background: #f4f0e9; }
        .label { color: #d56f4c; font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 12px 0; font-size: clamp(34px, 5vw, 48px); }
        .rating { color: #d18a2e; }
        .rating span { color: #788394; font-size: 13px; }
        .price { margin: 22px 0 12px; font-size: 27px; font-weight: bold; }
        .price del { margin-left: 8px; color: #98a1ad; font-size: 16px; font-weight: normal; }
        .description { color: #5d6878; line-height: 1.7; }
        ul { padding-left: 0; list-style: none; color: #485568; line-height: 2; }
        li::before { content: '✓'; margin-right: 10px; color: #37836a; font-weight: bold; }
        .buy-row { display: flex; gap: 12px; margin-top: 24px; }
        button { width: 100%; padding: 14px; color: white; background: #202b3c; border: 0; border-radius: 7px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { background: #d56f4c; }
        .shipping { margin-top: 13px; color: #788394; font-size: 13px; }
        .details { margin-top: 56px; padding: 26px; background: #f8f6f2; border-radius: 12px; line-height: 1.6; }
        @media (max-width: 700px) {
            header { flex-wrap: wrap; gap: 16px; padding: 18px 5%; }
            nav { order: 3; width: 100%; justify-content: space-between; gap: 10px; }
            main { padding: 22px 18px 45px; }
            .product { grid-template-columns: 1fr; gap: 28px; }
            .product-image { height: 320px; }
        }
    </style>
</head>
<body>
    <main id="shop">
        <section class="product" aria-label="Travel Ready Bundle product">
            <img class="product-image" src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Travel backpack ready for a trip">
            <div class="product-info">
                <h1>Travel Ready Bundle</h1>
                <div class="price">$49.00</div>
                <div class="buy-row">
                    <button id="add-button" type="button">Add to bag</button>
                </div>
            </div>
        </section>
        <section class="details" id="details">
        </section>
    </main>
    <script>
        const cartCount = document.getElementById('cart-count');
        document.getElementById('add-button').addEventListener('click', function () {
            if (cartCount) cartCount.textContent = Number(cartCount.textContent) + 1;
            this.textContent = 'Your item has been added to bag';
            window.setTimeout(() => { this.textContent = 'Add to bag'; }, 1500);
        });
    </script>
</body>
</html>
